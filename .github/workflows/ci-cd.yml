name: mlflow-fraud-ci-cd

on:
  push:
    branches: ["main", "master"]
  pull_request:
  repository_dispatch:
    types: ["model_drift_alert", "recall_drop_alert"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install -e .
      - name: Generate sample data
        run: python scripts/generate_sample_data.py --output data/raw/ieee_fraud_train_transaction.csv --rows 300
      - name: Lint
        run: ruff check src scripts
      - name: Validate data schema
        run: python scripts/validate_data.py --data data/raw/ieee_fraud_train_transaction.csv
      - name: Unit tests
        run: pytest -q

  build-and-package:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push training image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.train
          push: true
          tags: ghcr.io/${{ github.repository }}/ieee-fraud-train:latest
      - name: Build and push inference image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ghcr.io/${{ github.repository }}/ieee-fraud-api:latest

  deploy-and-trigger:
    runs-on: ubuntu-latest
    needs: build-and-package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install -e .
      - name: Generate sample data
        run: python scripts/generate_sample_data.py --output data/raw/ieee_fraud_train_transaction.csv --rows 300
      - name: Trigger MLflow pipeline run
        run: python scripts/run_pipeline.py --data data/raw/ieee_fraud_train_transaction.csv
      - name: Deploy updated model service
        run: echo "Deployment step would push the approved model to the inference service"
